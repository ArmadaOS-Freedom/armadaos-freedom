# USB file transfer owns the USB device controller exclusively while it runs.
# The standalone USB network link (and the SSH socket on it) is stopped before the
# MTP gadget is bound and resumed after the MTP gadget is gone, so the two never
# compete for the single controller.
[Service]
# The base armada-mtp.service unit prepares the MTP gadget first; this
# ExecStartPre hook stops the USB SSH socket and the standalone gadget
# synchronously before the base unit's post-start hook binds MTP.
ExecStartPre=+/usr/bin/systemctl stop armada-usb-ssh.socket armada-usb-network.service
# The original unbind (base ExecStop) runs first. These post-stop hooks always run,
# even if the start failed: tear down the old composite gadget first (for upgrades
# from the previous MTP + network composite version), then the MTP gadget itself.
ExecStopPost=
ExecStopPost=+/usr/libexec/armada/mtp-gadget unbind
ExecStopPost=+/usr/libexec/armada/usb-network detach /sys/kernel/config/usb_gadget/armada-mtp
ExecStopPost=+/usr/libexec/armada/mtp-gadget teardown
# After the teardown: the standalone link takes the controller back, if the user
# persisted switch is on and the profile allows it.
ExecStopPost=+/usr/libexec/armada/usb-network resume
