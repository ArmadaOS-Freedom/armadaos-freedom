ARMADA_DEVICE_ID=lenovo-tb322fc
ARMADA_DEVICE_NAME='Lenovo Legion Y700 Gen4'
ARMADA_SOC_CLASS=SM8750
# Initialize Game Mode in landscape-right (270 degrees) using DPU scanout.
# The accelerometer is currently unavailable; this is a fixed startup default.
ARMADA_PANEL_ORIENTATION=right
ARMADA_GAMESCOPE_USE_ROTATION_SHADER=0
ARMADA_PRIMARY_TOUCHSCREEN='NVTCapacitiveTouchScreen'
# TB322FC has no built-in gamepad; InputPlumber exposes sources but no
# CompositeDevice, so `controller-type apply` must not wait for one.
ARMADA_BUILTIN_GAMEPAD=0
