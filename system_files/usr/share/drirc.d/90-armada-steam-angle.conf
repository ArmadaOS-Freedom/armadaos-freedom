<?xml version="1.0" standalone="yes"?>
<!DOCTYPE driconf SYSTEM "driconf.dtd">
<driconf>
  <!-- Extends Mesa's existing msm Chromium ANGLE compatibility rule to
       Steam's CEF host process.
       See https://issues.angleproject.org/issues/431097618 -->
  <device driver="msm">
    <application name="Steam web helper" executable="steamwebhelper">
      <option name="force_gl_vendor" value="angleisbroken" />
    </application>
  </device>
</driconf>
