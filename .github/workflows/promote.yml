---
name: Promote release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Channel to promote to"
        type: choice
        options: [beta, stable]
        required: true
      source:
        description: "Source tag to promote from (e.g. staging or testing)"
        type: string
        default: testing
      version:
        description: "Optional release version (e.g. 1.0). Set when cutting a release: keeps an immutable :<version> tag as the permanent pin for the downloadable disk image."
        type: string
        default: ""

env:
  ARMADA_CANONICAL_IMAGE: "ghcr.io/mydanyi/armadaos-freedom"
  ARMADA_SIGNING_PUBLIC_KEY: "system_files/etc/pki/containers/armadaos-freedom.pub"
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.source }} -> ${{ inputs.target }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          need=""
          for tool in jq skopeo; do
            command -v "$tool" >/dev/null || need="$need $tool"
          done
          [ -z "$need" ] || { sudo apt-get update && sudo apt-get install -y $need; }

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.6.3'

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify source container signature
        id: resolve
        run: |
          set -euo pipefail
          REPO="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          if [ "${REPO}" != "${ARMADA_CANONICAL_IMAGE}" ]; then
            echo "::error::Freedom repository mismatch: this workflow only promotes ${ARMADA_CANONICAL_IMAGE}, but the source resolves to ${REPO}. Refusing to continue."
            exit 1
          fi
          if [ ! -f "${ARMADA_SIGNING_PUBLIC_KEY}" ] || [ ! -s "${ARMADA_SIGNING_PUBLIC_KEY}" ]; then
            echo "::error::Freedom signing public key missing or empty: ${ARMADA_SIGNING_PUBLIC_KEY}"
            exit 1
          fi
          # Pin to the digest so verify and the retag below act on the same image
          # even if a concurrent build re-points the source tag in between.
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${{ inputs.source }}")
          # Fail closed: never promote an unsigned build into beta/stable.
          cosign verify --key "${ARMADA_SIGNING_PUBLIC_KEY}" "${REPO}@${DIGEST}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Publish release tags
        run: |
          set -euxo pipefail
          REPO="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          SRC="${REPO}@${{ steps.resolve.outputs.digest }}"
          promote() { skopeo copy --all "docker://${SRC}" "docker://${REPO}:$1"; }

          promote "${{ inputs.target }}"

          # stable doubles as :latest for tooling that expects it.
          if [ "${{ inputs.target }}" = stable ]; then
            promote latest
          fi

          # Tag the release.
          if [ -n "${{ inputs.version }}" ]; then
            promote "${{ inputs.version }}"
          fi
